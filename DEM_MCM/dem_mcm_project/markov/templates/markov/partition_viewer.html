{% extends "markov/base.html" %}
{% block title %}Visualisation 3D{% endblock %}

{% block content %}
<div class="fade-in">
    <h2 class="text-xl font-bold text-gray-800 mb-6">🔬 Visualisation 3D des partitions</h2>

    <div class="glass-card p-5 mb-6">
        <p class="text-gray-600 text-sm mb-4">
            Sélectionnez un fichier DEM et une méthode de partitionnement pour visualiser
            les particules colorées par cellule.
        </p>
        <div class="flex flex-wrap gap-4 items-end" x-data="partitionViewer()" x-init="init()">
            <div>
                <label class="text-xs text-gray-500 block mb-1">Fichier DEM (index)</label>
                <input type="number" x-model="fileIndex" value="100"
                       class="border rounded-lg px-3 py-2 text-sm w-28 bg-white">
            </div>
            <div>
                <label class="text-xs text-gray-500 block mb-1">Méthode</label>
                <select x-model="method" class="border rounded-lg px-3 py-2 text-sm bg-white">
                    <option value="cartesian">Cartésien</option>
                    <option value="cylindrical">Cylindrique</option>
                    <option value="voronoi">Voronoï</option>
                    <option value="quantile">Quantile</option>
                </select>
            </div>
            <div>
                <label class="text-xs text-gray-500 block mb-1">N cellules</label>
                <input type="number" x-model="nCells" value="125"
                       class="border rounded-lg px-3 py-2 text-sm w-28 bg-white">
            </div>
            <button @click="loadPartitions()"
                    class="bg-blue-500 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-blue-600">
                🔧 Charger Plotly
            </button>
            <button @click="loadPartitionsPyVista()"
                    class="bg-purple-500 text-white px-6 py-2 rounded-lg text-sm font-medium hover:bg-purple-600">
                🧪 Rendu PyVista
            </button>
        </div>
    </div>

    <div class="glass-card p-5">
        <div id="viewer-3d" style="height:700px; width:100%;"></div>
        <div class="mt-4">
            <h4 class="text-sm font-semibold">Rendu PyVista (serveur)</h4>
            <img id="pyvista-render" src="" alt="PyVista render" style="width:100%; max-height:700px; object-fit:contain; background:#f8fafc;" />
        </div>
    </div>
</div>

<script>
function partitionViewer() {
    return {
        fileIndex: 100,
        method: 'cartesian',
        nCells: 125,
        init() {
            // Vue initiale vide
            Plotly.newPlot('viewer-3d', [], {
                scene: { xaxis: { title: 'X' }, yaxis: { title: 'Y' }, zaxis: { title: 'Z' },
                         aspectmode: 'data', bgcolor: 'rgb(250,250,252)' },
                paper_bgcolor: 'rgba(0,0,0,0)',
                height: 700,
                margin: { t: 30, b: 0, l: 0, r: 0 },
            });
        },
        async loadPartitions() {
            const url = `/api/partitions/?file_index=${this.fileIndex}&method=${this.method}&n_cells=${this.nCells}`;
            try {
                const resp = await fetch(url);
                const data = await resp.json();
                if (data.error) { alert(data.error); return; }

                // Grouper les particules par cellule pour de meilleurs contrastes
                const cellGroups = {};
                for (let i = 0; i < data.states.length; i++) {
                    const cell = data.states[i];
                    if (!cellGroups[cell]) {
                        cellGroups[cell] = { x: [], y: [], z: [], indices: [] };
                    }
                    cellGroups[cell].x.push(data.x[i]);
                    cellGroups[cell].y.push(data.y[i]);
                    cellGroups[cell].z.push(data.z[i]);
                    cellGroups[cell].indices.push(i);
                }

                // Créer un trace par groupe de cellules pour de meilleures couleurs distinctes
                const traces = [];
                // Palette de 20 couleurs distinctes (Plotly category20)
                const colors = [
                    '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',
                    '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf',
                    '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',
                    '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf'
                ];
                const cellKeys = Object.keys(cellGroups).sort((a, b) => parseInt(a) - parseInt(b));
                
                cellKeys.forEach((cell, idx) => {
                    const group = cellGroups[cell];
                    traces.push({
                        x: group.x,
                        y: group.y,
                        z: group.z,
                        mode: 'markers',
                        name: `Cellule ${cell}`,
                        marker: {
                            size: 5,
                            color: colors[idx % colors.length],
                            opacity: 0.8,
                            line: { color: 'rgba(0, 0, 0, 0.3)', width: 0.5 }
                        },
                        type: 'scatter3d',
                        hovertemplate: 'Cellule: ' + cell + '<br>x=%{x:.3f}<br>y=%{y:.3f}<br>z=%{z:.3f}<extra></extra>',
                    });
                });

                Plotly.react('viewer-3d', traces, {
                    scene: { xaxis: { title: 'X' }, yaxis: { title: 'Y' }, zaxis: { title: 'Z' },
                             aspectmode: 'data', bgcolor: 'rgb(250,250,252)',
                             camera: { eye: { x: 1.8, y: 1.8, z: 1.2 } } },
                    title: `${this.method} — ${data.n_cells} cellules — t=${this.fileIndex}`,
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    height: 700,
                });
            } catch (e) {
                alert('Erreur: ' + e.message);
            }
        },

        async loadPartitionsPyVista() {
            const url = `/api/partitions-pyvista/?file_index=${this.fileIndex}&method=${this.method}&n_cells=${this.nCells}`;
            try {
                const resp = await fetch(url);
                const payload = await resp.json();
                if (payload.error) {
                    alert(payload.error);
                    return;
                }
                const img = document.getElementById('pyvista-render');
                img.src = payload.image;
            } catch (e) {
                alert('Erreur PyVista: ' + e.message);
            }
        }
    };
}
</script>
{% endblock %}
